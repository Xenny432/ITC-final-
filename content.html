<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="Months/style.css">
    <script src="Months/calendar.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital@0;1&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="title">
    <h1>Commun-IT</h1>
</div>

<div class="three-box-ui">
    <div class="main-calendar-div">

        <div class="month-portion">
            <div class="calendar-title">
                <span style="font-size: 1.4rem; font-weight: bold; color: #1d1a15">School Monthly Calendar</span>
            </div>

            <div class="months-grid">
                <li class="rectangle" style="background-color: rgb(75, 137, 148);"><a style="font-weight: 900; color: rgb(255, 255, 255);">1st Semester</a></li>
                <li class="rectangle"><a href="Months/June.html">June</a></li>
                <li class="rectangle"><a href="Months/July.html">July</a></li>
                <li class="rectangle"><a href="Months/August.html">August</a></li>
                <li class="rectangle"><a href="Months/September.html">September</a></li>
                <li class="rectangle"><a href="Months/October.html">October</a></li>
                <li class="rectangle"><a href="Months/November.html">November</a></li>
                <li class="rectangle"><a href="Months/December.html">December</a></li>
                <li class="rectangle" style="background-color: rgb(75, 137, 148);"><a style="font-weight: 900; color:rgb(255, 255, 255)">2nd Semester</a></li>
                <li class="rectangle"><a href="Months/January.html">January</a></li>
                <li class="rectangle"><a href="Months/February.html">February</a></li>
                <li class="rectangle"><a href="Months/March.html">March</a></li>
                <li class="rectangle"><a href="Months/April.html">April</a></li>
                <li class="rectangle"><a href="Months/May.html">May</a></li>
            </div>
        </div>

        <div class="details-of-calendar">
            <div class="legend">
                <span class="calendar-detail-titles">Legend</span>
            </div>
            <div class="monthly-overview">
                <span class="calendar-detail-titles">Monthly Overview</span>
            </div>

        </div>

    </div>
    <div class="announcement-board">
        <div class="announcement-title">
            <span style="font-weight: 900; font-size: 1.4rem; color: #1d1a15">Announcements</span>
        </div>
        <div class="announcement-content">
        </div>
    </div>
</div>

</body>
</html>
