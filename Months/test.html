<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect Example</title>
    <style>
        /* 1. Define the default appearance */
        .hover-btn {
            background-color: #007BFF;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            
            /* 2. Add a transition for smooth movement (highly recommended) */
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* 3. Define the style changes inside the :hover block */
        .hover-btn:hover {
            background-color: #0056b3; /* Darkens the button background */
            transform: scale(1.05);     /* Scales the button up slightly */
        }
    </style>
</head>
<body>
    <div class="button">
    <button class="hover-btn";>Hover Over Me</button>
    </div>

</body>
</html>
